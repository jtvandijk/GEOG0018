project:
  type: website
  output-dir: docs

lang: en

execute:
  freeze: false
  cache: true

format:
  html:
    theme:
      light: flatly
      dark:  darkly
    callout-appearance: simple
    css: assets/styles.css
    toc: true
    smooth-scroll: true
    highlight-style: atom-one
    number-sections: true
    number-depth: 4
    pagetitle: "{{< var meta.title >}}"

website:
  repo-url: https://github.com/jtvandijk/GEOG0018
  repo-actions: [issue]
  page-navigation: true
  page-footer:
    center: "Course material by [Justin van Dijk](https://www.mappingdutchman.com). Available under [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/)."
  search:
    location: sidebar
    type: overlay
  sidebar:
    style: floating
    collapse-level: 2
    logo: assets/logo.svg
    tools:
      - icon: github
        href: https://github.com/jtvandijk/GEOG0018
    contents:
      - section: "Module overview"
        contents:
          - text: "Welcome"
            file: 00-index.qmd
          - text: "Getting Started"
            file: 00-installation.qmd
      - section: "Statistical Analysis"
        contents:
          - text: "1 R for Data Analysis"
            file: 01-recap.qmd
          - text: "2 Statistical Analysis I"
            file: 02-statistics1.qmd
          - text: "3 Statistical Analysis II"
            file: 03-statistics2.qmd
      - section: "Spatial Analysis"
        contents:
          - text: "4 Spatial Analysis I"
            file: 04-spatial1.qmd
          - text: "5 Spatial Analysis II"
            file: 05-spatial2.qmd
          
editor: source